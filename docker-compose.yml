version: '3.8'

services:
  flask:
    build:
    container_name: flask-app
    expose:
      - "5000"
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask
    networks:
      - webnet

networks: webnet
